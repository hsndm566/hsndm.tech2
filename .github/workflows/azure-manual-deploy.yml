name: Azure fallback deployment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_AZURE only after Azure validation and cost approval.'
        required: true
        type: string
      image:
        description: 'Approved backend container image URI.'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY_AZURE' }}
    runs-on: ubuntu-latest
    environment: azure-production
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Preflight deployment plan
        uses: azure/cli@v2
        with:
          inlineScript: |
            az account set --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"
            az deployment group what-if \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --template-file infra/azure/main.bicep \
              --parameters deployRuntime=true containerImage="${{ inputs.image }}" managedEnvironmentId="${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}"
      - name: Deploy approved Azure runtime
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group create \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --template-file infra/azure/main.bicep \
              --parameters deployRuntime=true containerImage="${{ inputs.image }}" managedEnvironmentId="${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}"
