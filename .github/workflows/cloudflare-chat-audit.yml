name: Cloudflare Chat Functions Audit
on:
  push:
    branches: [audit/cloudflare-chat-functions-20260924]
    paths: [.github/workflows/cloudflare-chat-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret availability only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && echo "CF_TOKEN=true" || echo "CF_TOKEN=false"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && echo "CF_ACCOUNT=true" || echo "CF_ACCOUNT=false"
