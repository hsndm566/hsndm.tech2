name: Temporary Live Site Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run read-only production browser audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-audit /tmp/autoapply-browser-audit
          cd /tmp/autoapply-browser-audit
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund puppeteer-core@24
          cat > audit.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const chrome = '/usr/bin/google-chrome-stable';
          const base = 'https://www.hsndm.tech';
          const outDir = '/home/runner/work/hsndm.tech2/hsndm.tech2/live-audit';
          const routes = ['/', '/ar/', '/sign-in', '/ar/sign-in', '/sign-up', '/ar/sign-up', '/privacy', '/ar/privacy', '/terms', '/ar/terms', '/dashboard'];
          const browser = await puppeteer.launch({headless:'new', executablePath:chrome, args:['--no-sandbox','--disable-gpu']});
          const result = {generatedAt:new Date().toISOString(), routes:[], interactions:{}, linkChecks:[]};

          async function audit(route, width, height, label) {
            const page = await browser.newPage();
            await page.setViewport({width,height});
            const consoleErrors=[], pageErrors=[], requestFailures=[], badResponses=[];
            page.on('console', m => { if (m.type()==='error') consoleErrors.push(m.text()); });
            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('requestfailed', r => requestFailures.push({url:r.url(),error:r.failure()?.errorText||'failed'}));
            page.on('response', r => { if (r.status()>=400) badResponses.push({url:r.url(),status:r.status()}); });
            let status=null, navError=null;
            try {
              const response = await page.goto(base+route,{waitUntil:'networkidle2',timeout:45000});
              status=response?.status()??null;
              await new Promise(r=>setTimeout(r,900));
            } catch (e) { navError=String(e); }
            const data = await page.evaluate(() => {
              const clean = s => (s||'').replace(/\s+/g,' ').trim();
              const anchors=[...document.querySelectorAll('a')].map(a=>({text:clean(a.textContent),href:a.href,raw:a.getAttribute('href')||''}));
              const buttons=[...document.querySelectorAll('button')].map(b=>({text:clean(b.textContent),aria:b.getAttribute('aria-label')||'',disabled:b.disabled}));
              const inputs=[...document.querySelectorAll('input,select,textarea')].map(el=>({tag:el.tagName.toLowerCase(),type:el.getAttribute('type')||'',name:el.getAttribute('name')||'',placeholder:el.getAttribute('placeholder')||'',aria:el.getAttribute('aria-label')||'',required:!!el.required}));
              const images=[...document.images].map(i=>({src:i.src,alt:i.alt,naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight}));
              const videos=[...document.querySelectorAll('video')].map(v=>({src:v.currentSrc||v.querySelector('source')?.src||'',readyState:v.readyState,networkState:v.networkState,error:v.error?{code:v.error.code,message:v.error.message}:null,paused:v.paused,muted:v.muted,controls:v.controls}));
              const missingButtonNames=[...document.querySelectorAll('button')].filter(b=>!clean(b.textContent)&&!b.getAttribute('aria-label')&&!b.getAttribute('title')).length;
              const missingImgAlt=[...document.images].filter(i=>!i.hasAttribute('alt')).length;
              const unlabeledInputs=[...document.querySelectorAll('input,select,textarea')].filter(el=>{
                if(el.type==='hidden') return false;
                const id=el.id;
                const labelled=id&&document.querySelector('label[for="'+CSS.escape(id)+'"]');
                return !labelled&&!el.getAttribute('aria-label')&&!el.getAttribute('aria-labelledby')&&!el.closest('label');
              }).length;
              return {
                title:document.title,
                lang:document.documentElement.lang,
                dir:document.documentElement.dir,
                canonical:document.querySelector('link[rel=canonical]')?.href||'',
                metaDescription:document.querySelector('meta[name=description]')?.content||'',
                robots:document.querySelector('meta[name=robots]')?.content||'',
                h1:[...document.querySelectorAll('h1')].map(x=>clean(x.textContent)),
                h2:[...document.querySelectorAll('h2')].map(x=>clean(x.textContent)),
                anchors,buttons,inputs,images,videos,
                a11y:{missingButtonNames,missingImgAlt,unlabeledInputs},
                width:{scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth},
                ids:[...document.querySelectorAll('[id]')].map(x=>x.id),
                bodyText:clean(document.body.innerText).slice(0,18000)
              };
            });
            const safe=(route==='/'?'home':route.replace(/^\//,'').replaceAll('/','-'))+'-'+label;
            await page.screenshot({path:outDir+'/'+safe+'.png',fullPage:true});
            await page.close();
            return {route,label,status,finalUrl:page.url?.()||null,navError,consoleErrors:[...new Set(consoleErrors)].slice(0,40),pageErrors:[...new Set(pageErrors)].slice(0,20),requestFailures:requestFailures.slice(0,40),badResponses:badResponses.slice(0,40),...data};
          }

          for (const route of routes) {
            result.routes.push(await audit(route,1440,1000,'desktop'));
            if (['/','/ar/','/sign-in','/sign-up'].includes(route)) result.routes.push(await audit(route,390,844,'mobile'));
          }

          async function interactions(path) {
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844});
            await page.goto(base+path,{waitUntil:'networkidle2',timeout:45000});
            await new Promise(r=>setTimeout(r,500));
            const x={path};
            const theme=await page.$('button.theme-toggle');
            x.themeBefore=await page.evaluate(()=>document.documentElement.dataset.theme||'');
            if(theme){await theme.click(); await new Promise(r=>setTimeout(r,100));}
            x.themeAfter=await page.evaluate(()=>document.documentElement.dataset.theme||'');
            const menu=await page.$('button.mobile-menu');
            if(menu){
              x.menuBefore=await page.evaluate(el=>el.getAttribute('aria-expanded'),menu);
              await menu.click(); await new Promise(r=>setTimeout(r,100));
              x.menuAfter=await page.evaluate(el=>el.getAttribute('aria-expanded'),menu);
            }
            x.hashTargets=await page.evaluate(()=>[...document.querySelectorAll('a[href*="#"]')].map(a=>{
              const raw=a.getAttribute('href')||'';
              const hash=raw.includes('#')?'#'+raw.split('#').slice(1).join('#'):'';
              return {text:(a.textContent||'').replace(/\s+/g,' ').trim(),raw,hash,targetExists:hash?!!document.querySelector(hash):null};
            }));
            const faq=await page.$('.faq summary');
            if(faq){
              x.faqBefore=await page.evaluate(el=>el.parentElement?.open===true,faq);
              await faq.click(); await new Promise(r=>setTimeout(r,100));
              x.faqAfter=await page.evaluate(el=>el.parentElement?.open===true,faq);
            }
            await page.close();
            return x;
          }
          result.interactions.en=await interactions('/');
          result.interactions.ar=await interactions('/ar/');

          const internal=[...new Set(result.routes.filter(r=>r.route==='/'||r.route==='/ar/').flatMap(r=>r.anchors.map(a=>a.href)).filter(h=>h.startsWith(base)))];
          const checkPage=await browser.newPage();
          for(const href of internal){
            let item={href,status:null,finalUrl:null,error:null};
            try {
              const response=await checkPage.goto(href,{waitUntil:'domcontentloaded',timeout:25000});
              item.status=response?.status()??null;
              item.finalUrl=checkPage.url();
            } catch(e) { item.error=String(e); item.finalUrl=checkPage.url(); }
            result.linkChecks.push(item);
          }
          await checkPage.close();
          await browser.close();
          fs.writeFileSync(outDir+'/audit.json',JSON.stringify(result,null,2));

          const compact={
            routes:result.routes.map(r=>({
              route:r.route,label:r.label,status:r.status,title:r.title,lang:r.lang,dir:r.dir,
              h1:r.h1,overflow:r.width.scrollWidth>r.width.clientWidth,a11y:r.a11y,
              consoleErrors:r.consoleErrors,pageErrors:r.pageErrors,requestFailures:r.requestFailures,
              badResponses:r.badResponses,brokenImages:r.images.filter(i=>i.naturalWidth===0),
              videos:r.videos,canonical:r.canonical,robots:r.robots
            })),
            interactions:result.interactions,
            brokenLinks:result.linkChecks.filter(x=>x.error||!x.status||x.status>=400)
          };
          console.log(JSON.stringify(compact,null,2));
          NODE
          node audit.mjs | tee /home/runner/work/hsndm.tech2/hsndm.tech2/live-audit/summary.txt

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-site-readonly-audit
          path: live-audit/
          if-no-files-found: error
