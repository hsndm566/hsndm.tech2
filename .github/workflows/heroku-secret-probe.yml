name: Heroku Secret Probe

on:
  push:
    branches: [ops/heroku-secret-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment secrets without exposing values
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        shell: bash
        run: |
          for name in HEROKU_API_KEY DATABASE_URL CLERK_SECRET_KEY VITE_CLERK_PUBLISHABLE_KEY JWT_SECRET GROQ_API_KEY BREVO_API_KEY; do
            if [ -n "${!name}" ]; then
              echo "$name=configured"
            else
              echo "$name=missing"
            fi
          done
