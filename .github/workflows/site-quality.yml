name: Public Site Quality

on:
  push:
    branches: [main, autoapply-v2-preview]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Production static build
        run: pnpm build:pages

      # Keep this gate aligned with the files that are actually shipped by build:pages.
      - name: Verify public-site checklist
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/public/index.html
          test -s dist/public/ar/index.html
          test -s dist/public/dashboard/index.html
          test -s dist/public/sign-in/index.html
          test -s dist/public/auth/callback/index.html
          test -s dist/public/404.html
          grep -q 'noindex, nofollow' dist/public/index.html
          grep -q 'AutoApply SA' dist/public/index.html
          grep -q 'Disallow: /' dist/public/robots.txt
          if find dist/public -type f -name '*.map' -print -quit | grep -q .; then
            echo 'Production source maps found unexpectedly.' >&2
            exit 1
          fi
