name: Public Site Quality

on:
  push:
    branches: [main, autoapply-v2-preview]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: V2 bilingual parity audit
        run: pnpm audit:bilingual

      - name: Production static build
        run: pnpm build:pages

      # Keep this gate aligned with the files that are actually shipped by build:pages.
      - name: Verify public-site checklist
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            dist/public/index.html
            dist/public/ar/index.html
            dist/public/dashboard/index.html
            dist/public/sign-in/index.html
            dist/public/auth/callback/index.html
            dist/public/404.html
            dist/public/robots.txt
            dist/public/sitemap.xml
          )
          for file in "${required_files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "Missing generated public file: $file" >&2
              exit 1
            fi
          done
          grep -Eq 'index, follow|all' dist/public/index.html || { echo 'Missing indexable robots marker in public index.' >&2; exit 1; }
          grep -Eq 'AutoApply ?SA|AutoApplySa' dist/public/index.html || { echo 'Missing AutoApply brand marker in public index.' >&2; exit 1; }
          grep -q '^Allow: /$' dist/public/robots.txt || { echo 'Missing public crawl allow rule.' >&2; exit 1; }
          if grep -q '^Disallow: /$' dist/public/robots.txt; then
            echo 'robots.txt blocks the entire public site.' >&2
            exit 1
          fi
          grep -q '<loc>https://www.hsndm.tech/</loc>' dist/public/sitemap.xml || { echo 'Missing public homepage in sitemap.' >&2; exit 1; }
          if grep -Eq '/(pricing|services|ats|enquire|how-it-works|support|case-studies|campaign-report-sample)/' dist/public/sitemap.xml; then
            echo 'Sitemap contains stale V1 URLs.' >&2
            exit 1
          fi
          if find dist/public -type f -name '*.map' -print -quit | grep -q .; then
            echo 'Production source maps found unexpectedly.' >&2
            exit 1
          fi

      - name: Live production browser verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-verification
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-family browser found on runner." | tee live-verification/report.txt
            exit 0
          fi

          echo "Browser: $CHROME" | tee live-verification/report.txt

          for path in "/" "/ar/"; do
            slug="$(printf '%s' "$path" | tr '/ ' '__')"
            [ "$slug" = "_" ] && slug="home"
            url="https://www.hsndm.tech$path"
            echo "" | tee -a live-verification/report.txt
            echo "URL: $url" | tee -a live-verification/report.txt

            "$CHROME"               --headless=new               --no-sandbox               --disable-gpu               --hide-scrollbars               --window-size=1440,5000               --virtual-time-budget=12000               --dump-dom "$url" > "live-verification/$slug.html" 2>"live-verification/$slug-browser.log" || true

            "$CHROME"               --headless=new               --no-sandbox               --disable-gpu               --hide-scrollbars               --window-size=1440,5000               --virtual-time-budget=12000               --screenshot="live-verification/$slug.png" "$url" >>"live-verification/$slug-browser.log" 2>&1 || true

            bytes="$(wc -c < "live-verification/$slug.html" | tr -d ' ')"
            echo "DOM bytes: $bytes" | tee -a live-verification/report.txt
            for marker in               "workspace-showcase"               "YOUR SEARCH, IN ONE PLACE"               "One place to move forward."               "Your opportunities"               "Application activity"               "بحثك في مكان واحد"               "كل خطواتك في مكان واحد."               "فرصك"               "نشاط الطلبات"; do
              if grep -Fq "$marker" "live-verification/$slug.html"; then
                echo "FOUND: $marker" | tee -a live-verification/report.txt
              else
                echo "MISSING: $marker" | tee -a live-verification/report.txt
              fi
            done
          done

          for path in "/" "/ar/"; do
            slug="$(printf '%s' "$path" | tr '/ ' '__')"
            [ "$slug" = "_" ] && slug="home"
            url="https://www.hsndm.tech$path"
            echo "" | tee -a live-verification/report.txt
            echo "MOBILE URL: $url" | tee -a live-verification/report.txt
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --window-size=390,5000 \
              --force-device-scale-factor=1 \
              --virtual-time-budget=12000 \
              --screenshot="live-verification/$slug-mobile.png" "$url" >"live-verification/$slug-mobile-browser.log" 2>&1 || true
            if [ -s "live-verification/$slug-mobile.png" ]; then
              echo "MOBILE SCREENSHOT: captured" | tee -a live-verification/report.txt
            else
              echo "MOBILE SCREENSHOT: missing" | tee -a live-verification/report.txt
            fi
          done

          echo "" | tee -a live-verification/report.txt
          echo "HEADERS" | tee -a live-verification/report.txt
          curl -sSIL --max-time 20 https://www.hsndm.tech/ | sed -n '1,25p' | tee -a live-verification/report.txt || true

      - name: Upload live browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-production-browser-verification
          path: live-verification/
          if-no-files-found: warn
