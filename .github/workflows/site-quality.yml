name: Public Site Quality

on:
  push:
    branches: [main, autoapply-v2-preview]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Production static build
        run: pnpm build:pages

      # Keep this gate aligned with the files that are actually shipped by build:pages.
      - name: Verify public-site checklist
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            dist/public/index.html
            dist/public/ar/index.html
            dist/public/dashboard/index.html
            dist/public/sign-in/index.html
            dist/public/auth/callback/index.html
            dist/public/404.html
            dist/public/robots.txt
            dist/public/sitemap.xml
          )
          for file in "${required_files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "Missing generated public file: $file" >&2
              exit 1
            fi
          done
          grep -Eq 'index, follow|all' dist/public/index.html || { echo 'Missing indexable robots marker in public index.' >&2; exit 1; }
          grep -Eq 'AutoApply ?SA|AutoApplySa' dist/public/index.html || { echo 'Missing AutoApply brand marker in public index.' >&2; exit 1; }
          grep -q '^Allow: /$' dist/public/robots.txt || { echo 'Missing public crawl allow rule.' >&2; exit 1; }
          if grep -q '^Disallow: /$' dist/public/robots.txt; then
            echo 'robots.txt blocks the entire public site.' >&2
            exit 1
          fi
          grep -q '<loc>https://www.hsndm.tech/</loc>' dist/public/sitemap.xml || { echo 'Missing public homepage in sitemap.' >&2; exit 1; }
          if grep -Eq '/(pricing|services|ats|enquire|how-it-works|support|case-studies|campaign-report-sample)/' dist/public/sitemap.xml; then
            echo 'Sitemap contains stale V1 URLs.' >&2
            exit 1
          fi
          if find dist/public -type f -name '*.map' -print -quit | grep -q .; then
            echo 'Production source maps found unexpectedly.' >&2
            exit 1
          fi
