<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AutoApply SA workflow</title>
  <desc id="desc">A three-step preview showing profile, matching, and ready stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062e27"/><stop offset="1" stop-color="#0d4a3b"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#b8e3cf" stroke-opacity=".08"/></pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/><rect width="1200" height="675" rx="28" fill="url(#grid)"/>
  <circle cx="980" cy="120" r="180" fill="#3ccf91" fill-opacity=".12" filter="url(#glow)"/>
  <path d="M160 390H1040" stroke="#b8e3cf" stroke-opacity=".28" stroke-width="3" stroke-dasharray="8 12"/>
  <text x="88" y="92" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">AUTOAPPLY SA</text>
  <text x="88" y="142" fill="#b8e3cf" font-family="Arial,sans-serif" font-size="18" letter-spacing="1">YOUR JOB SEARCH, CLEARER</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(150 290)"><circle cy="100" r="62" fill="#f8faf7"/><path d="M-22 118V83l22-20 22 20v35" fill="none" stroke="#0d4a3b" stroke-width="9" stroke-linejoin="round"/><text x="-37" y="202" fill="#fff" font-size="17" font-weight="700">PROFILE</text><text x="-58" y="230" fill="#b8e3cf" font-size="14">Review your facts</text></g>
    <g transform="translate(600 290)"><circle cy="100" r="62" fill="#3ccf91"/><path d="M-27 100h54M0 73v54" stroke="#062e27" stroke-width="9" stroke-linecap="round"/><text x="-39" y="202" fill="#fff" font-size="17" font-weight="700">MATCH</text><text x="-58" y="230" fill="#b8e3cf" font-size="14">Find suitable roles</text></g>
    <g transform="translate(1050 290)"><circle cy="100" r="62" fill="#f8faf7"/><path d="M-28 101l18 18 39-43" fill="none" stroke="#0d4a3b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="-27" y="202" fill="#fff" font-size="17" font-weight="700">READY</text><text x="-62" y="230" fill="#b8e3cf" font-size="14">You stay in control</text></g>
  </g>
  <text x="88" y="610" fill="#fff" fill-opacity=".78" font-family="Arial,sans-serif" font-size="16">Upload once. Review clearly. Move forward with confidence.</text>
</svg>
